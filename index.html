    <script>
      // Automatically ensure trailing slash on GitHub Pages repository URLs to prevent relative asset 404s
      (function() {
        var path = window.location.pathname;
        if (window.location.hostname.endsWith('github.io') && path.indexOf('.') === -1 && !path.endsWith('/')) {
          window.location.replace(path + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
